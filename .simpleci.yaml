# .simpleci.yaml
# Put this file in the ROOT of the repo you want SimpleCI to test.
# When you push to GitHub, SimpleCI will read this file and run these steps.

pipeline:
  name: SimpleCI-backend

  branches:
    - main
    - develop    # only these branches will trigger CI

  steps:
    - name: Install Dependencies
      run: npm install --prefix apps/backend

    - name: Run Tests
      run: npm test --prefix apps/backend

    - name: Build
      run: npm run build --prefix apps/backend
