# ─────────────────────────────────────────────────────────────
# docker-compose.yml
# Starts PostgreSQL locally for SimpleCI
# Run with: docker compose up -d
# ─────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:16-alpine
    container_name: simpleci-postgres
    environment:
      POSTGRES_USER: simpleci
      POSTGRES_PASSWORD: simpleci_secret
      POSTGRES_DB: simpleci_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpleci -d simpleci_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
