# ─────────────────────────────────────────────────────────────
# prometheus.yml — Prometheus scrape configuration for SimpleCI
# ─────────────────────────────────────────────────────────────
# Start Prometheus with docker compose (see docker-compose.yml)
# Web UI: http://localhost:9090
# ─────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s   # How often Prometheus fetches /metrics
  evaluation_interval: 15s   # How often alerting rules are evaluated

# Alertmanager integration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scrapes itself (meta-monitoring)
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # SimpleCI backend /metrics endpoint
  - job_name: simpleci
    static_configs:
      - targets: [host.docker.internal:3000]   # Backend runs on host (npm run dev)
    metrics_path: /metrics
    scrape_interval: 15s
