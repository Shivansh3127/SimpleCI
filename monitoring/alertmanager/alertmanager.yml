# ─────────────────────────────────────────────────────────────
# alertmanager.yml — Alertmanager notification config
# ─────────────────────────────────────────────────────────────
# Web UI: http://localhost:9093
#
# To enable email/Slack/PagerDuty notifications, fill in the
# receiver config below and restart alertmanager.
# ─────────────────────────────────────────────────────────────

global:
  # SMTP config for email alerts (fill in your SMTP details)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'simpleci-alerts@example.com'
  # smtp_auth_username: 'your@email.com'
  # smtp_auth_password: 'your-app-password'

route:
  receiver: 'default'
  group_by: [alertname, severity]
  group_wait:      30s   # Wait to batch alerts in the same group
  group_interval:  5m    # How often to resend if still firing
  repeat_interval: 4h    # Repeat notification every 4h if unresolved

  # Route critical alerts immediately
  routes:
    - match:
        severity: critical
      receiver: 'default'
      group_wait: 0s

receivers:
  - name: 'default'
    # ── Webhook (generic) ─────────────────────────────────────
    # Uncomment and fill in a webhook URL (e.g. Slack incoming webhook)
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     send_resolved: true

    # ── Email ─────────────────────────────────────────────────
    # email_configs:
    #   - to: 'your-team@example.com'
    #     send_resolved: true

inhibit_rules:
  # If a critical alert is firing, suppress the warning-level version
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname]
