# ─────────────────────────────────────────────────────────────
# datasource.yml — Auto-provision Prometheus as Grafana datasource
# Placed at: /etc/grafana/provisioning/datasources/datasource.yml
# ─────────────────────────────────────────────────────────────
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s
